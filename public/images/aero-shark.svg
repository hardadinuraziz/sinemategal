<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130">
  <defs>
    <linearGradient id="sharkTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.3" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="sharkBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="sharkFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sharkGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Animated Tail Fin -->
  <g>
    <path d="M214 66 L270 24 Q252 64 268 106 L214 74 Z" fill="url(#sharkFin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="skewY" values="0;-9;0;9;0" dur="0.85s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Dorsal Fin -->
  <path d="M108 42 Q128 4 152 10 Q146 32 152 46 Z" fill="url(#sharkFin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Small Second Dorsal & Anal Fins -->
  <path d="M188 53 Q196 41 205 44 Q202 52 204 56 Z" fill="url(#sharkFin)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M186 81 Q194 94 202 91 Q199 82 201 79 Z" fill="url(#sharkFin)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <!-- Main Body -->
  <path d="M18 68 Q48 36 124 38 Q186 40 222 66 Q186 92 124 92 Q50 92 18 68 Z" fill="url(#sharkTop)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <!-- White Underbelly -->
  <path d="M22 69 Q54 90 124 90 Q176 90 212 72 Q165 76 118 76 Q58 76 22 69 Z" fill="url(#sharkBelly)"/>
  <!-- Pectoral Fin -->
  <path d="M88 76 Q108 118 134 114 Q120 94 116 78 Z" fill="url(#sharkFin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Gill Slits -->
  <path d="M78 58 Q75 68 78 76 M85 57 Q82 68 85 77 M92 57 Q89 68 92 77" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Glossy Aero Highlight -->
  <path d="M36 58 Q88 42 162 46 Q128 54 64 58 Z" fill="url(#sharkGloss)"/>
  <!-- Eye -->
  <circle cx="46" cy="60" r="6.5" fill="#ffffff"/>
  <circle cx="44.5" cy="60" r="4" fill="#082f49"/>
  <circle cx="43" cy="58.5" r="1.5" fill="#ffffff"/>
  <!-- Friendly Smile Line -->
  <path d="M24 72 Q36 77 48 73" fill="none" stroke="#0c4a6e" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
